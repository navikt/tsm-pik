[versions]
kotlin = "2.4.10"
logback = "1.6.3"
logbackEncoder = "9.0"
spotless = "8.10.1"
jackson = "3.2.2"
detekt = "2.0.0-alpha.6"
ktfmt = "0.62"
tsm-juridisk = "56"
jvmVersion = "25"
jsonSchemaValidator = "3.0.7"
mockk = "1.14.11"
kotest = "6.2.4"

[libraries]

# Monitoring and observability
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logbackEncoder" }

# Tsm dependencies
tsm-juridisk = { module = "no.nav.tsm.regulus:juridisk", version.ref = "tsm-juridisk" }

# Testing
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator"}
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotest = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }



# Transitive Vulnerabilities
jackson-core = { module = "tools.jackson.core:jackson-core", version.ref = "jackson" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "dev.detekt",  version.ref = "detekt" }
